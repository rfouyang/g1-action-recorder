<!doctype html>
<html lang="en" data-theme="wireframe">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="G1 pose and action engineering console">
    <title>G1 Action Recorder · Motion Studio</title>
    <link
      rel="stylesheet"
      href="{{ url_for('g1_3d_static', path='/css/app.css') }}"
    >
    <script
      defer
      src="{{ url_for('g1_3d_static', path='/js/websocket.js') }}"
    ></script>
    <script
      defer
      src="{{ url_for('g1_3d_static', path='/js/panels/pose_recorder.js') }}"
    ></script>
    <script
      defer
      src="{{ url_for('g1_3d_static', path='/js/panels/pose_composer.js') }}"
    ></script>
    <script
      defer
      src="{{ url_for('g1_3d_static', path='/js/panels/action.js') }}"
    ></script>
    <script
      defer
      src="{{ url_for('g1_3d_static', path='/js/panels/action_player.js') }}"
    ></script>
    <script
      defer
      src="{{ url_for('g1_3d_static', path='/js/app.js') }}"
    ></script>
  </head>
  <body class="h-screen min-h-[42rem] overflow-hidden bg-base-200 text-base-content antialiased">
    {% include "layout/navbar.html" %}

    <main class="grid h-[calc(100vh-6.75rem)] min-h-[35rem] grid-cols-1 lg:h-[calc(100vh-4rem)] lg:min-h-[38rem] lg:grid-cols-[minmax(0,1fr)_minmax(0,2fr)]">
      <aside class="min-h-0 overflow-y-auto border-r border-base-300 bg-base-100">
        {% include "panels/pose_recorder.html" %}
        {% include "panels/pose_composer.html" %}
        {% include "panels/action.html" %}
        {% include "panels/action_player.html" %}
      </aside>

      {% include "components/viewer.html" %}
    </main>
  </body>
</html>
