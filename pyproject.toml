[project]
name = "g1-action-recorder"
version = "0.1.0"
description = "Pose and action recording tools for the Unitree G1 robot."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "jinja2>=3.1,<4",
    "mujoco>=3.3,<4",
    "numpy>=1.26,<3",
    "pillow>=11,<13",
    "pin-pink>=4.4,<5",
    "quadprog>=0.1,<1",
    "uvicorn>=0.52,<1",
    "viser[urdf]>=1.0,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "component*", "config*", "util*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
