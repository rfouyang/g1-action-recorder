apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  name: g1-3d
spec:
  ingressClassName: nginx
  rules:
  - host: g1-3d.chs.gto-stc-aida.com
    http:
      paths:
      - backend:
          service:
            name: g1-3d
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - g1-3d.chs.gto-stc-aida.com
    secretName: g1-3d.chs.gto-stc-aida.com
