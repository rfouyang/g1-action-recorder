apiVersion: apps/v1
kind: Deployment
metadata:
  name: g1-3d
  labels:
    app.kubernetes.io/name: g1-3d
    app.kubernetes.io/component: authoring-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: g1-3d
  template:
    metadata:
      labels:
        app.kubernetes.io/name: g1-3d
        app.kubernetes.io/component: authoring-console
    spec:
      containers:
        - name: g1-3d
          image: g1-3d:v0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: viser
              containerPort: 8001
              protocol: TCP
          env:
            - name: BYTEPLUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: g1-3d
                  key: BYTEPLUS_API_KEY
            - name: G1_3D_HOST
              value: "0.0.0.0"
            - name: G1_3D_PORT
              value: "8000"
            - name: VISER_HOST
              value: "0.0.0.0"
            - name: VISER_PORT
              value: "8001"
            - name: MUJOCO_GL
              value: egl
          startupProbe:
            httpGet:
              path: /api/g1/system/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/g1/system/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/g1/system/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      restartPolicy: Always
